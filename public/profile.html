<!DOCTYPE html>
<html lang="ru" data-mode="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#eef0f4">
    <title>Профиль — AI Tools Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function(){var r=document.documentElement;try{var m=localStorage.getItem('theme')||'auto';
      var d=m==='dark'||(m==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
      r.dataset.mode=m;r.dataset.theme=d?'dark':'light';
      var t=document.querySelector('meta[name="theme-color"]');if(t)t.content=d?'#0d0f13':'#eef0f4';}catch(e){}})();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AI Tools Hub">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header class="topbar glass">
        <a class="brand" href="/index.html"><span class="dotmark">AI</span>AI Tools Hub</a>
        <span class="sp"></span>
        <button class="btn quiet" data-open-cmd title="��������� ������� � ?K">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
            <span class="cmd-hint">?K</span>
        </button>
        <button class="theme-toggle" aria-label="Сменить тему">
            <svg class="i-auto" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6"/><path d="M12 3.4a8.6 8.6 0 0 1 0 17.2Z" fill="currentColor" stroke="none"/></svg>
            <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>
            <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 13.2A8.6 8.6 0 0 1 10.8 3a8.6 8.6 0 1 0 10.2 10.2Z"/></svg>
        </button>
        <a class="btn" href="/index.html">К каталогу</a>
    </header>

    <main class="wrap hero" style="padding-bottom:24px">
        <div id="profileBox"></div>
    </main>

    <footer class="wrap footer">
        <span class="m-label">© 2026 AI Tools Hub</span>
        <a class="m-label" href="/index.html">Вернуться в каталог</a>
    </footer>

    <div id="toast" aria-live="polite"></div>

    <script src="/toast.js"></script>
    <script src="/theme.js"></script>
    <script src="/bg.js"></script>
    <script src="/select.js"></script>
    <script src="/motion-loader.js"></script>
    <script>window.__motion = null; loadMotion().then(m => window.__motion = m);</script>
    <script src="/transitions.js"></script>
    <script src="/palette.js"></script>
    <script>
        const box = document.getElementById('profileBox');
        const PENCIL = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9a2.5 2.5 0 0 0-3.5-3.5L4.5 16.5V20Z"/><path d="M14.5 6.5 17.5 9.5"/></svg>';

        const logo = t => `<img src="https://www.google.com/s2/favicons?domain=${t.domain}&sz=128" alt=""
            onerror="this.outerHTML='<span style=font-weight:650>${t.name[0]}</span>'">`;

        async function loadProfile() {
            let user;
            try {
                ({ user } = await fetch('/api/me', { credentials: 'same-origin' }).then(r => r.ok ? r.json() : Promise.reject()));
            } catch {
                box.innerHTML = `
                    <div class="panel glass" style="padding:32px;text-align:center">
                        <p>Вы не авторизованы.</p>
                        <a class="btn primary" href="/index.html" style="margin-top:18px">Войти</a>
                    </div>`;
                return;
            }

            const [favorites, stack] = await Promise.all([
                fetch('/api/favorites', { credentials: 'same-origin' }).then(r => r.json()).catch(() => ({ favorites: [] })),
                fetch('/api/stack', { credentials: 'same-origin' }).then(r => r.json()).catch(() => ({ stack: [] })),
            ]);

            const avatarInner = user.avatar
                ? `<img class="avatar-xl" src="${user.avatar}" alt="">`
                : `<span class="avatar-xl initial">${user.username[0].toUpperCase()}</span>`;

            box.innerHTML = `
                <section class="profile-hero">
                    <label class="avatar-drop" id="avatarDrop" tabindex="0">
                        ${avatarInner}
                        <span class="veil">${PENCIL}<span>Сменить фото</span></span>
                        <input type="file" id="avatarInput" accept="image/*" hidden>
                    </label>

                    <h1 class="profile-name">
                        ${user.username}
                        <svg class="verified" viewBox="0 0 24 24" fill="currentColor" aria-label="Подтверждён"><path d="M12 1.8l2.4 2.1 3.2-.3.9 3.1 2.7 1.8-1.4 2.9 1.4 2.9-2.7 1.8-.9 3.1-3.2-.3L12 21.6l-2.4-2.1-3.2.3-.9-3.1-2.7-1.8 1.4-2.9-1.4-2.9 2.7-1.8.9-3.1 3.2.3L12 1.8Zm-1.2 13.6 5.1-5.1-1.3-1.3-3.8 3.8-1.8-1.8-1.3 1.3 3.1 3.1Z"/></svg>
                    </h1>
                    <p class="profile-sub">${user.email} · с нами с ${new Date(user.created_at).toLocaleDateString('ru-RU')}</p>

                    <div class="quick">
                        <a href="#fav"><b>${favorites.favorites.length}</b><span>избранное</span></a>
                        <a href="#stack"><b>${stack.stack.length}</b><span>в моём стеке</span></a>
                        <a href="/index.html#builder"><b>3</b><span>подборки</span></a>
                    </div>
                </section>

                <div class="phead" id="fav">
                    <h2>Избранное</h2>
                    <span class="m-label">${favorites.favorites.length} инструментов</span>
                </div>
                <div class="gal" id="favGal"></div>

                <div class="phead" id="stack">
                    <h2>Мой стек</h2>
                    <span class="m-label" id="stackMeta"></span>
                </div>
                <div class="gal" id="stackGal"></div>

                <div class="phead" id="budget">
                    <h2>Счётчик лимитов</h2>
                    <span class="m-label">сколько потрачено сегодня и хватит ли бесплатного тарифа</span>
                </div>
                <div class="panel glass" id="usageBox" style="padding:20px"></div>

                <div class="phead" id="budget">
                    <h2>Смета по моему стеку</h2>
                    <span class="m-label">сколько выйдет в месяц, если платить за все платные сервисы из стека</span>
                </div>
                <div class="panel glass" id="budgetBox" style="padding:20px"></div>

                <div class="phead" id="watch">
                    <h2>Что изменилось у моих сервисов</h2>
                    <span class="m-label">история по инструментам из стека и избранного</span>
                </div>
                <div class="panel glass" id="watchBox" style="padding:20px"></div>

                <div class="phead" id="reports">
                    <h2>Мои наблюдения</h2>
                    <span class="m-label">факт-чеки, которые вы добавили</span>
                </div>
                <div class="panel glass" id="myReports" style="padding:20px"></div>

                <div class="phead" id="recent">
                    <h2>Недавно смотрели</h2>
                    <span class="m-label">история просмотров в этом браузере</span>
                </div>
                <div class="panel glass" id="recentBox" style="padding:20px"></div>

                <div class="phead"><h2>Данные</h2></div>
                <div class="panel glass" style="padding:18px;display:flex;gap:10px;flex-wrap:wrap">
                    <button class="btn" id="exportBtn">Экспорт закладок</button>
                    <button class="btn" id="importBtn">Импорт закладок</button>
                    <input type="file" id="importFile" accept=".json,application/json" hidden>
                    <span class="m-label" style="align-self:center">файл JSON с вашими инструментами</span>
                </div>

                <div style="display:flex;justify-content:center;margin-top:28px">
                    <button class="btn" id="logoutBtn">Выйти из аккаунта</button>
                </div>`;

            const favGal = document.getElementById('favGal');
            favGal.innerHTML = favorites.favorites.length
                ? favorites.favorites.map(t => `
                    <a class="tile" href="/tool/${t.id}">
                        <span class="mark">${logo(t)}</span>
                        <b>${t.name}</b>
                        <small>${t.domain}</small>
                    </a>`).join('')
                : '<p class="empty" style="padding:18px">Пока пусто. Нажмите на звезду на странице инструмента.</p>';

            const stackGal = document.getElementById('stackGal');
            stackGal.innerHTML = stack.stack && stack.stack.length
                ? stack.stack.map(t => `
                    <a class="tile" href="/tool/${t.id}">
                        <span class="mark">${logo(t)}</span>
                        <b>${t.name}</b>
                        <small>★ ${t.rating}</small>
                    </a>`).join('')
                : '<p class="empty" style="padding:18px">Стек не собран. Соберите его в стек-билдере на главной.</p>';
            document.getElementById('stackMeta').textContent = stack.updatedAt
                ? 'обновлён ' + new Date(stack.updatedAt).toLocaleString('ru-RU')
                : '';

            /* ---------- недавно смотрели ---------- */
            const recentBox = document.getElementById('recentBox');
            try {
                const seen = JSON.parse(localStorage.getItem('recent-tools') || '[]');
                recentBox.innerHTML = seen.length
                    ? `<div class="usage-list">${seen.slice(0, 8).map(s => `
                        <div class="usage-row" style="grid-template-columns:1fr auto">
                            <a class="usage-name" href="/tool/${s.id}">${s.name}</a>
                            <span class="m-label">${new Date(s.at).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' })}</span>
                        </div>`).join('')}</div>`
                    : '<p class="empty">Здесь появятся сервисы, которые вы открывали.</p>';
            } catch {
                recentBox.innerHTML = '<p class="empty">Не удалось прочитать историю просмотров.</p>';
            }

            /* ---------- счётчик лимитов ---------- */
            const usageBox = document.getElementById('usageBox');
            try {
                const usage = await fetch('/api/usage', { credentials: 'same-origin' }).then(r => r.json());
                if (!usage.items.length) {
                    usageBox.innerHTML = `<p class="empty">Счётчик пуст. Отмечайте потраченные запросы
                        кнопкой «+1» на странице сервиса — и здесь увидите, не подобрали ли вы лимит.</p>`;
                } else {
                    usageBox.innerHTML = `
                        <div class="usage-list">
                            ${usage.items.map(u => `
                                <div class="usage-row${u.state === 'over' ? ' is-over' : u.state === 'near' ? ' is-near' : ''}">
                                    <a class="usage-name" href="/tool/${u.toolId}">${u.name}</a>
                                    <div class="usage-bar">
                                        <span style="width:${u.limitPerDay
                                            ? Math.min(100, Math.round(u.count / u.limitPerDay * 100)) : 0}%"></span>
                                    </div>
                                    <span class="usage-count">${u.count}${u.limitPerDay ? ' / ' + u.limitPerDay : ''}</span>
                                    <span class="m-label">${u.limitLabel || 'без лимита'}</span>
                                    <span class="usage-actions">
                                        <button data-usage="${u.toolId}" data-delta="-1">−</button>
                                        <button data-usage="${u.toolId}" data-delta="1">+1</button>
                                    </span>
                                </div>`).join('')}
                        </div>
                        <p class="m-label" style="margin-top:12px">
                            ${new Date(usage.day).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' })} ·
                            жёлтым отмечено, что лимит почти исчерпан, красным — что исчерпан.
                        </p>`;

                    usageBox.querySelectorAll('[data-usage]').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            const tid = Number(btn.dataset.usage);
                            const delta = Number(btn.dataset.delta);
                            const res = await fetch('/api/usage', {
                                method: 'POST', credentials: 'same-origin',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ toolId: tid, delta }),
                            });
                            if (!res.ok) { showToast('Войдите, чтобы вести счёт'); return; }
                            loadUsage();
                        });
                    });
                }
            } catch {
                usageBox.innerHTML = '<p class="empty">Не удалось загрузить счётчик.</p>';
            }

            async function loadUsage() {
                const usage = await fetch('/api/usage', { credentials: 'same-origin' }).then(r => r.json());
                usageBox.querySelectorAll('.usage-row').forEach(row => {
                    const btn = row.querySelector('[data-delta="1"]');
                    if (!btn) return;
                    const tid = Number(btn.dataset.usage);
                    const u = usage.items.find(x => x.toolId === tid);
                    if (!u) return;
                    const countEl = row.querySelector('.usage-count');
                    countEl.textContent = u.count + (u.limitPerDay ? ' / ' + u.limitPerDay : '');
                    const bar = row.querySelector('.usage-bar span');
                    if (bar) bar.style.width = (u.limitPerDay ? Math.min(100, Math.round(u.count / u.limitPerDay * 100)) : 0) + '%';
                    row.classList.toggle('is-over', u.state === 'over');
                    row.classList.toggle('is-near', u.state === 'near');
                });
            }

            /* ---------- смета по стеку ---------- */
            const watched = [...new Map([...(stack.stack || []), ...(favorites.favorites || [])].map(t => [t.id, t])).values()];
            const budgetBox = document.getElementById('budgetBox');
            const paid = watched.filter(t => t.priceMonth > 0);
            const free = watched.filter(t => !t.priceMonth);
            const monthly = paid.reduce((s, t) => s + t.priceMonth, 0);

            budgetBox.innerHTML = watched.length
                ? `<div class="budget-grid">
                        <div class="budget-total">
                            <span class="m-label">в месяц, если платить за всё</span>
                            <b>$${monthly.toFixed(0)}</b>
                            <p class="m-label">${paid.length} платных из ${watched.length} в стеке</p>
                        </div>
                        <div class="budget-list">
                            ${watched.map(t => `
                                <div class="budget-row">
                                    <a href="/tool/${t.id}">${t.name}</a>
                                    <span class="m-label">${t.limits || ''}</span>
                                    <span class="budget-price">${t.priceMonth > 0 ? '$' + t.priceMonth + '/мес' : 'бесплатно'}</span>
                                </div>`).join('')}
                        </div>
                    </div>
                    ${free.length ? `<p class="m-label" style="margin-top:14px">Бесплатных в стеке: ${free.map(t => t.name).join(', ')}. Их можно не оплачивать вообще.</p>` : ''}`
                : '<p class="empty">Соберите стек — посчитаем, во сколько обойдётся подписка на все сервисы сразу.</p>';

            /* ---------- что изменилось у моих сервисов ---------- */
            const watchBox = document.getElementById('watchBox');
            if (!watched.length) {
                watchBox.innerHTML = '<p class="empty">Пока нечего показывать. Добавьте сервисы в стек или избранное.</p>';
            } else {
                const changes = [];
                for (const t of watched) {
                    try {
                        const { history } = await fetch(`/api/tools/${t.id}/history`).then(r => r.json());
                        history.slice(0, 3).forEach(h => changes.push({ tool: t, ...h }));
                    } catch { }
                }
                changes.sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
                watchBox.innerHTML = changes.length
                    ? changes.map(c => `
                        <div class="watch-row">
                            <a class="watch-tool" href="/tool/${c.tool.id}">${c.tool.name}</a>
                            <span class="m-label">${c.field}</span>
                            <p class="watch-change"><s>${c.old_value || '—'}</s> → <b>${c.new_value}</b></p>
                            <span class="m-label">${new Date(c.created_at).toLocaleDateString('ru-RU')}</span>
                        </div>`).join('')
                    : '<p class="empty">У ваших сервисов пока не было зафиксировано изменений.</p>';
            }

            /* ---------- мои наблюдения ---------- */
            const myReports = document.getElementById('myReports');
            try {
                const mine = await fetch('/api/me/reports', { credentials: 'same-origin' }).then(r => r.json());
                myReports.innerHTML = mine.reports && mine.reports.length
                    ? mine.reports.map(r => `
                        <div class="watch-row">
                            <a class="watch-tool" href="/tool/${r.toolName}">${r.toolName}</a>
                            <span class="m-label">${r.observed !== null ? r.observed + ' ' + (r.unit || '') : 'заметка'}</span>
                            <p class="watch-change">${r.works ? 'работает' : 'не работает'}${r.needsVpn ? ', нужен VPN' : ''}</p>
                            <span class="m-label">${new Date(r.created_at).toLocaleDateString('ru-RU')}</span>
                        </div>`).join('')
                    : '<p class="empty">Вы ещё не добавляли наблюдений. Их можно отправлять на странице любого инструмента.</p>';
            } catch {
                myReports.innerHTML = '<p class="empty">Не удалось загрузить наблюдения.</p>';
            }

            /* ---------- аватар: наведение и перетаскивание ---------- */
            const drop = document.getElementById('avatarDrop');
            const input = document.getElementById('avatarInput');
            drop.addEventListener('click', () => input.click());
            drop.addEventListener('keydown', e => {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); }
            });
            ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => {
                e.preventDefault(); drop.classList.add('drag');
            }));
            ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => {
                e.preventDefault(); drop.classList.remove('drag');
            }));
            drop.addEventListener('drop', e => upload(e.dataTransfer.files[0]));
            input.addEventListener('change', e => upload(e.target.files[0]));

            async function upload(file) {
                if (!file) return;
                if (!file.type.startsWith('image/')) { showToast('Нужен файл изображения'); return; }
                if (file.size > 1.2 * 1024 * 1024) { showToast('Файл больше 1,2 МБ — выберите поменьше'); return; }
                const reader = new FileReader();
                reader.onload = async () => {
                    const r = await fetch('/api/avatar', {
                        method: 'POST', credentials: 'same-origin',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ avatar: reader.result }),
                    });
                    if (!r.ok) { showToast('Не удалось загрузить изображение'); return; }
                    const img = document.createElement('img');
                    img.className = 'avatar-xl';
                    img.src = reader.result;
                    img.alt = '';
                    document.querySelector('.avatar-drop .avatar-xl').replaceWith(img);
                    showToast('Аватар обновлён');
                };
                reader.readAsDataURL(file);
            }

            document.getElementById('logoutBtn').addEventListener('click', async () => {
                await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' });
                showToast('Вы вышли из аккаунта');
                location.href = 'index.html';
            });

            document.getElementById('exportBtn').addEventListener('click', () => {
                const blob = new Blob([JSON.stringify({ favorites: favorites.favorites.map(t => t.id) }, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'ai-tools-favorites.json';
                a.click();
                showToast('Закладки выгружены');
            });

            document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
            document.getElementById('importFile').addEventListener('change', e => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async () => {
                    try {
                        const parsed = JSON.parse(reader.result);
                        const ids = Array.isArray(parsed) ? parsed : parsed.favorites;
                        const r = await fetch('/api/favorites/import', {
                            method: 'POST', credentials: 'same-origin',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ toolIds: ids }),
                        });
                        const d = await r.json();
                        if (r.ok) { showToast(`Импортировано: ${d.imported}`); setTimeout(loadProfile, 700); }
                        else showToast(d.error || 'Не удалось импортировать');
                    } catch { showToast('Файл повреждён или это не JSON'); }
                };
                reader.readAsText(file);
            });
        }

        loadProfile();
    </script>
</body>
</html>
